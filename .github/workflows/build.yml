name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    # ============================================================
    # 🆕 v14.1.0: RELEASE-ПОДПИСЬ
    # Декодируем keystore из Base64 и кладём в app/baza-upload-key.jks
    # ============================================================
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/baza-upload-key.jks
        ls -la app/baza-upload-key.jks

    # ============================================================
    # 🆕 v14.1.0: СБОРКА RELEASE APK
    # Передаём секреты в переменные окружения для build.gradle.kts
    # ============================================================
    - name: Build Release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/app/baza-upload-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk

    - name: Read version from build.gradle.kts
      id: version
      run: |
        VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Read version: $VERSION_NAME ($VERSION_CODE)"

    - name: Generate version.json
      run: |
        cat > version.json <<EOF
        {
          "versionCode": ${{ steps.version.outputs.code }},
          "versionName": "${{ steps.version.outputs.name }}",
          "downloadUrl": "https://disk.yandex.ru/d/jA1J1i8ZFvK8Sg",
          "releaseNotes": "Обновление от $(date +'%Y-%m-%d')"
        }
        EOF
        echo "--- version.json ---"
        cat version.json

    - name: Commit version.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.json
        if git diff --cached --quiet; then
          echo "No changes to version.json"
        else
          git commit -m "chore: version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            sleep 5
          done
        fi
