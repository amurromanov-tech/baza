name: Android CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    # ============================================================
    # 🆕 Декодирование release-keystore из GitHub Secrets
    # ============================================================
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/baza-release.jks
        ls -la ${{ github.workspace }}/baza-release.jks

    # ============================================================
    # Сборка APK с release-подписью
    # ============================================================
    - name: Build APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/baza-release.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Read version from build.gradle.kts
      id: version
      run: |
        VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Read version: $VERSION_NAME ($VERSION_CODE)"

    - name: Generate version.json
      run: |
        cat > version.json <<EOF
        {
          "versionCode": ${{ steps.version.outputs.code }},
          "versionName": "${{ steps.version.outputs.name }}",
          "downloadUrl": "https://disk.yandex.ru/d/jA1J1i8ZFvK8Sg",
          "releaseNotes": "Обновление от $(date +'%Y-%m-%d')"
        }
        EOF
        echo "--- version.json ---"
        cat version.json

    - name: Commit version.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.json
        if git diff --cached --quiet; then
          echo "No changes to version.json"
          exit 0
        fi
        git commit -m "chore: version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
        
        # Retry push с rebase — защита от гонки
        for i in 1 2 3; do
          if git pull --rebase origin main && git push; then
            echo "Push successful on attempt $i"
            break
          fi
          echo "Push failed, retrying ($i)..."
          sleep 5
        done
