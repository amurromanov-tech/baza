name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Read version from build.gradle.kts
      id: version
      run: |
        VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Read version: $VERSION_NAME ($VERSION_CODE)"

    - name: Generate version.json
      run: |
        cat > version.json <<EOF
        {
          "versionCode": ${{ steps.version.outputs.code }},
          "versionName": "${{ steps.version.outputs.name }}",
          "downloadUrl": "https://disk.yandex.ru/d/jA1J1i8ZFvK8Sg",
          "releaseNotes": "Обновление от $(date +'%Y-%m-%d')"
        }
        EOF
        echo "--- version.json ---"
        cat version.json

    - name: Commit version.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add version.json
        if git diff --cached --quiet; then
          echo "No changes to version.json"
        else
          git commit -m "chore: version ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
          git pull --rebase origin main
          git push
        fi
